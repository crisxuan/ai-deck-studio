<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Deck Studio Showcase</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f4;
      --text: #111827;
      --muted: #667085;
      --card: #ffffff;
      --line: #d8dee6;
      --accent: #d5274a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 56px 0;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 5vw, 4.4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .lead {
      max-width: 720px;
      margin: 0 0 34px;
      color: var(--muted);
      font-size: 1.12rem;
      line-height: 1.55;
    }

    .card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.72fr);
      gap: 28px;
      align-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 26px 70px rgba(15, 23, 42, 0.14);
    }

    .card-copy {
      padding: 34px;
    }

    .eyebrow {
      display: inline-flex;
      margin: 0 0 14px;
      border: 2px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 900;
      padding: 7px 12px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: clamp(1.7rem, 3vw, 2.7rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .card p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border-radius: 999px;
      background: #111827;
      color: #ffffff;
      font-weight: 850;
      padding: 0 18px;
      text-decoration: none;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 520px;
      object-fit: cover;
      border-left: 1px solid var(--line);
      background: #f8fafc;
    }

    @media (max-width: 760px) {
      .card {
        grid-template-columns: 1fr;
      }

      img {
        border-top: 1px solid var(--line);
        border-left: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>AI Deck Studio Showcase</h1>
    <p class="lead">可直接转发的 HTML 演示文稿示例。打开链接即可浏览，不需要安装项目或运行命令。</p>

    <article class="card">
      <div class="card-copy">
        <p class="eyebrow">自媒体推广轮播</p>
        <h2>cxuanAI 公众号推广</h2>
        <p>3:4 移动端轮播风格，用于公众号、朋友圈、小红书式分享，强调关注理由、栏目结构和行动 CTA。</p>
        <a class="button" href="./cxuanai-wechat-promo-zh/">打开演示</a>
      </div>
      <img src="./cxuanai-wechat-promo-zh/contact-sheet.png" alt="cxuanAI 公众号推广轮播总览">
    </article>
  </main>
</body>
</html>
